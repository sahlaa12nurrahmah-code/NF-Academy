<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Produk Toko</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .btn-group {
      text-align: center;
      margin-bottom: 15px;
    }

    button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      background-color: #4c9baf;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #4c9baf;
    }

    table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #4c9baf;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2>Manajemen Produk Toko</h2>

  <div class="btn-group">
    <button id="btnTampil">Tampilkan Produk</button>
    <button id="btnTambah">Tambah Produk</button>
    <button id="btnHapus">Hapus Produk</button>
  </div>

  <!--Menggunakan tabel agar terlihat lebih rapi dengan CSS sederhana-->
  <table id="tabelProduk">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Harga</th>
        <th>Stok</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data produk akan ditampilkan di tbody-->
    </tbody>
  </table>

  <script>
    // Array produk in code (minimal 5)
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 },
      { id: 4, nama: "Monitor", harga: 1500000, stok: 4 },
      { id: 5, nama: "Printer", harga: 2500000, stok: 2 }
    ];

    const tbody = document.querySelector("#tabelProduk tbody");

    // Menampilkan produk dengan Destructuring
    function tampilkanProduk() {
      tbody.innerHTML = "";
      for (let {id, nama, harga, stok} of produkToko) {
        let row = `<tr>
          <td>${id}</td>
          <td>${nama}</td>
          <td>Rp${harga.toLocaleString()}</td>
          <td>${stok}</td>
        </tr>`;
        tbody.innerHTML += row;
      }
    }

    // Menambahkan produk dengan Spread Operator
    function tambahProduk(nama, harga, stok) {
      let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
      produkToko = [...produkToko, { id: idBaru, nama, harga, stok }];
      alert(`Produk "${nama}" berhasil ditambahkan!`);
      tampilkanProduk();
    }

    // Menghapus produk dengan Rest Parameter
    const hapusProduk = (...ids) => {
      ids.forEach(id => {
        let index = produkToko.findIndex(produk => produk.id === id);
        if (index !== -1) {
          alert(`Produk "${produkToko[index].nama}" berhasil dihapus!`);
          produkToko.splice(index, 1);
        } else {
          alert(`Produk dengan ID ${id} tidak ditemukan!`);
        }
      });
      tampilkanProduk();
    };

    // Event Listener untuk button
    document.getElementById("btnTampil").addEventListener("click", () => {
      tampilkanProduk();
    });

    // Button tambah produk lewat prompt pop up
    document.getElementById("btnTambah").addEventListener("click", () => {
      let nama = prompt("Masukkan nama produk:");
      let harga = parseInt(prompt("Masukkan harga produk:"));
      let stok = parseInt(prompt("Masukkan stok produk:"));
      if (nama && harga && stok) {
        tambahProduk(nama, harga, stok);
      }
    });

    // Button hapus produk
    document.getElementById("btnHapus").addEventListener("click", () => {
      let id = parseInt(prompt("Masukkan ID produk yang akan dihapus:"));
      if (id) {
        hapusProduk(id);
      }
    });

    // Tampilkan produk
    tampilkanProduk();
  </script>
</body>
</html>
