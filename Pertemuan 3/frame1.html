<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Utama (Grid)</title>
    <!--Tugas 4 dengan menambahkan Grid dan melakukan revisi pada file html lain dengan perubahan menambahkan internal css dan isi study yang sebelumnya keliru.-->
    <!--Gambar-gambar yang terdapat dalam kode hanya dapat terlihat bila diakses secara online karena seluruh foto tertaut dari internet-->
    <style>
        body {
            margin: 0;
            display: grid;
            grid-template-rows: 15% 5% 1fr 15%;
            grid-template-columns: 25% 1fr 25%;
            grid-template-areas:
                "header header header"
                "nav nav nav"
                "menu main menu2"
                "footer footer footer";
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        header { grid-area: header; }
        nav { grid-area: nav; }
        aside.menu { grid-area: menu; }
        main { grid-area: main; }
        aside.menu2 { grid-area: menu2; }
        footer { grid-area: footer; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <iframe src="header.html"></iframe>
    </header>
    <nav>
        <iframe src="nav.html"></iframe>
    </nav>
    <aside class="menu">
        <iframe src="menu.html"></iframe>
    </aside>
    <main>
        <iframe src="beranda.html" name="utama"></iframe>
    </main>
    <aside class="menu2">
        <iframe src="menu2.html"></iframe>
    </aside>
    <footer>
        <iframe src="footer.html"></iframe>
    </footer>
</body>
</html>
