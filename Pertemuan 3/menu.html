<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Sosial Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d2a3e6 0%, #a8e6a3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            width: 200px;
        }

        .social-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-link {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            text-decoration: none;
            color: #2c3e50;
            border-radius: 50px;
            font-weight: 500;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .social-link:hover {
            background: linear-gradient(145deg, #a8e6a3, #d2a3e6);
        }

        .social-link i {
            margin-right: 10px;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .fa-instagram { color: #E4405F; }
        .fa-twitter   { color: #1DA1F2; }
        .fa-youtube   { color: #FF0000; }
        .fa-pinterest { color: #BD081C; }
        .fa-linkedin  { color: #0077B5; }
    </style>
</head>
<body>
    <div class="container">
        <ul class="social-list">
            <li><a href="https://www.instagram.com/shlnrrhmh?igsh=M3Zya3U5ajFyNnY=" target="utama" class="social-link"><i class="fa-brands fa-instagram"></i> Instagram</a></li>
            <li><a href="https://x.com/jinjitkecil?t=_RJy1g8750C4u7Msh7IWwg&s=09" target="utama" class="social-link"><i class="fa-brands fa-twitter"></i> X</a></li>
            <li><a href="https://youtube.com/@windahbasudara?si=QKE0aXy9A8qp34yM" target="utama" class="social-link"><i class="fa-brands fa-youtube"></i> YouTube</a></li>
            <li><a href="https://pin.it/7FlMgQhWr" target="utama" class="social-link"><i class="fa-brands fa-pinterest"></i> Pinterest</a></li>
            <li><a href="https://linkedin.com/in/sahlaa-nurrahmah" target="utama" class="social-link"><i class="fa-brands fa-linkedin"></i> LinkedIn</a></li>
        </ul>
    </div>
</body>
</html>
