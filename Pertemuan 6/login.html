    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css utama.css">
</head>
<body class="body-login">
    <main class="container-login">
        <section class="card" aria-labelledby="login-title">
            <h1 id="login-title">Masuk</h1>
            <form class="login-form" method="post" action="#" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Masukkan username Anda" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Masukkan email Anda" required autocomplete="email">
                </div>
                <button type="submit" class="btn">Masuk</button>
            </form>
        </section>
    </main>
</body>
</html>
